# Live Stream — Dropwizard configuration
# Phase 2: PostgreSQL must be running (see README).

server:
  applicationConnectors:
    - type: http
      port: 8080
  adminConnectors:
    - type: http
      port: 8081

logging:
  level: INFO
  loggers:
    com.livestream: DEBUG

# Phase 2: Hibernate will use this DataSource
database:
  driverClass: org.postgresql.Driver
  url: jdbc:postgresql://localhost:5432/livestream
  user: livestream
  password: change-me
  properties:
    charSet: UTF-8
    hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate.hbm2ddl.auto: update
    hibernate.show_sql: false
  maxWaitForConnection: 1s
  validationQuery: "SELECT 1"
  initialSize: 1
  minSize: 1
  maxSize: 8

# Phase 3: FFmpeg and HLS output directory
ffmpegPath: /opt/homebrew/bin/ffmpeg
hlsOutputDir: ./data/hls
