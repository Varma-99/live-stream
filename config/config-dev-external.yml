# External encode plane — control app only; you run FFmpeg (or any RTMP client) to SRS.
# Same LAN setup as config-dev.yml — no public IP required.
#
# 1) ./scripts/start-srs.sh
# 2) ./mvnw server config/config-dev-external.yml
# 3) POST /streams/start or broadcast.html → copy rtmpPublishUrl, run FFmpeg publish
# 4) Viewer list shows stream once SRS receives RTMP (ingestLivenessFilter)

server:
  applicationConnectors:
    - type: http
      port: 8080
      bindHost: 0.0.0.0
  adminConnectors:
    - type: http
      port: 8081
      bindHost: 0.0.0.0

logging:
  level: INFO
  loggers:
    com.livestream: DEBUG
    org.hibernate.engine.internal.StatisticalLoggingSessionEventListener: WARN

devMode: true

database:
  driverClass: org.h2.Driver
  url: jdbc:h2:mem:livestream-external-dev;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
  user: sa
  password: ""
  properties:
    hibernate.dialect: org.hibernate.dialect.H2Dialect
    hibernate.hbm2ddl.auto: update
    hibernate.show_sql: false
  maxWaitForConnection: 1s
  validationQuery: "SELECT 1"
  initialSize: 1
  minSize: 1
  maxSize: 128

ffmpegPath: /opt/homebrew/bin/ffmpeg
hlsOutputDir: ./data/hls
videoInput: test
useTestVideo: true
rtmpPort: 1935

publicWebBase: http://10.255.51.126:8080

streamDelivery: srs
# Media plane — RTMP ingest target for FFmpeg (127.0.0.1 if SRS on same Mac)
srsRtmpPublishBase: rtmp://127.0.0.1:1935
# Control plane proxies WHEP/API to media plane
srsWhepBase: http://127.0.0.1:1985
srsApiBase: http://127.0.0.1:1985
srsApiEnabled: true
abrEnabled: false

encoderMode: external
ingestLivenessFilter: true

mediamtxRtmpPublishBase: rtmp://127.0.0.1:1935
mediamtxWebrtcBase: http://127.0.0.1:8889
mediamtxApiBase: http://127.0.0.1:9997
mediamtxApiEnabled: false
