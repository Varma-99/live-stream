# Local development — embedded H2 + SRS WebRTC (no PostgreSQL required)
# 1) ./scripts/start-srs.sh
# 2) ./mvnw server config/config-dev.yml   (or Run in IntelliJ — uses this file)

server:
  applicationConnectors:
    - type: http
      port: 8080
      bindHost: 0.0.0.0
  adminConnectors:
    - type: http
      port: 8081
      bindHost: 0.0.0.0

logging:
  level: INFO
  loggers:
    com.livestream: DEBUG
    org.hibernate.engine.internal.StatisticalLoggingSessionEventListener: WARN

devMode: true

database:
  driverClass: org.h2.Driver
  # In-memory avoids "database file locked" when a previous run is still open
  url: jdbc:h2:mem:livestream-dev;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
  user: sa
  password: ""
  properties:
    hibernate.dialect: org.hibernate.dialect.H2Dialect
    hibernate.hbm2ddl.auto: update
    hibernate.show_sql: false
  maxWaitForConnection: 1s
  validationQuery: "SELECT 1"
  initialSize: 1
  minSize: 1
  maxSize: 128

ffmpegPath: /opt/homebrew/bin/ffmpeg
hlsOutputDir: ./data/hls
# laptop camera (macOS). Use "test" for color bars, "rtmp" for OBS later
videoInput: camera
cameraDevice: "0:0"
useTestVideo: false
rtmpPort: 1935

# LAN viewer links — keep in sync with SRS CANDIDATE (ipconfig getifaddr en0)
publicWebBase: http://10.255.51.126:8080

# SRS mode (stop MediaMTX first — both use RTMP :1935)
streamDelivery: srs
srsRtmpPublishBase: rtmp://127.0.0.1:1935
srsWhepBase: http://127.0.0.1:1985
srsApiBase: http://127.0.0.1:1985
srsApiEnabled: true
abrEnabled: true

# Legacy MediaMTX (streamDelivery: mediamtx) — not used in SRS mode
mediamtxRtmpPublishBase: rtmp://127.0.0.1:1935
mediamtxWebrtcBase: http://127.0.0.1:8889
mediamtxApiBase: http://127.0.0.1:9997
mediamtxApiEnabled: false
