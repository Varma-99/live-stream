# SRS origin — RTMP ingest + WebRTC WHEP (viewers hit origin; SRS 6 disables RTC on RTMP edges).
# API/WHEP inside container :1985 — host-mapped to :1995 in cluster compose.
# HAProxy :1985 on host forwards WHEP to origin until SRS edge WHEP is supported.

listen 1935;
max_connections 1000;
daemon off;
srs_log_tank console;

http_api {
    enabled on;
    listen 1985;
}

http_server {
    enabled on;
    listen 8080;
    dir ./objs/nginx/html;
}

stats {
    network 0;
}

rtc_server {
    enabled on;
    listen 8000;
    candidate $CANDIDATE;
}

vhost __defaultVhost__ {
    rtc {
        enabled on;
        rtmp_to_rtc on;
        rtc_to_rtmp off;
    }
}
