global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5s
    timeout client  120s
    timeout server  120s
    option http-keep-alive

frontend app_lb
    bind *:8080
    default_backend app_instances

backend app_instances
    balance roundrobin
    option httpchk GET /internal/health
    http-check expect status 200
    # Apps run on host JVMs; use host.docker.internal when LB runs in Docker (Colima).
    server app1 host.docker.internal:8090 check inter 3s fall 2 rise 2
    server app2 host.docker.internal:8092 check inter 3s fall 2 rise 2

listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 5s
