global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5s
    timeout client  60s
    timeout server  60s

frontend srs_whep
    bind *:1985
    # Base stream key for ABR: strip _high / _mid / _low suffix (HAProxy 3.x regsub chain).
    http-request set-var(txn.base) url_param(stream),regsub(_high$,),regsub(_mid$,),regsub(_low$,)
    http-request set-header X-Srs-Stream-Base %[var(txn.base)] if { urlp(stream) -m found }
    default_backend srs_whep_origin

# SRS 6 RTMP-edge nodes disable WebRTC (RtcDisabled). WHEP terminates on origin.
# Edge containers remain for future SRS edge-WHEP; they are not used for WHEP today.
backend srs_whep_origin
    balance hdr(X-Srs-Stream-Base)
    hash-type consistent
    option httpchk GET /api/v1/streams/
    http-check expect status 200
    server origin srs-origin:1985 check inter 3s fall 2 rise 2
