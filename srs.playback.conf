# SRS playback — standalone RTMP ingest + WebRTC WHEP (no cluster remote).
# Receives RTMP forwarded from srs-origin. SRS 6 RtcDisabled on mode remote edges.
# Set CANDIDATE to LAN IP:host-udp-port (e.g. 10.255.61.28:8000).

listen 1935;
max_connections 1000;
daemon off;
srs_log_tank console;

http_api {
    enabled on;
    listen 1985;
}

http_server {
    enabled on;
    listen 8080;
    dir ./objs/nginx/html;
}

stats {
    network 0;
}

rtc_server {
    enabled on;
    listen 8000;
    candidate $CANDIDATE;
}

vhost __defaultVhost__ {
    rtc {
        enabled on;
        rtmp_to_rtc on;
        rtc_to_rtmp off;
    }
}
