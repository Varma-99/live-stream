# SRS — live-stream-sandbox (RTMP ingest + WebRTC WHEP + HTTP-FLV/HLS)
# Run: ./scripts/start-srs.sh  (Docker + Colima)
# Stop MediaMTX first — shares RTMP port 1935.

listen 1935;
max_connections 1000;
daemon off;
srs_log_tank console;

http_server {
    enabled on;
    listen 8080;
    dir ./objs/nginx/html;
}

http_api {
    enabled on;
    listen 1985;
}

stats {
    network 0;
}

rtc_server {
    enabled on;
    listen 8000;
    candidate $CANDIDATE;
}

vhost __defaultVhost__ {
    rtc {
        enabled on;
        rtmp_to_rtc on;
        rtc_to_rtmp off;
    }
    http_remux {
        enabled on;
        mount [vhost]/[app]/[stream].flv;
    }
    hls {
        enabled on;
        hls_fragment 2;
        hls_window 10;
    }
}
