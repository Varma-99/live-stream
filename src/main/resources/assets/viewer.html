<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>View — Live Stream</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7"></script>
  <link rel="stylesheet" href="/ui/common.css">
</head>
<body>
  <main class="card" style="max-width:900px">
    <p class="back"><a href="/ui/">← Home</a></p>
    <h1>View (watch)</h1>
    <p class="muted" id="modeHint">Loading delivery mode…</p>

    <label for="streamPick">Live streams</label>
    <select id="streamPick">
      <option value="">— loading —</option>
    </select>
    <div class="actions">
      <button class="btn primary" type="button" onclick="loadStream()">Play</button>
      <button class="btn" type="button" onclick="refreshStreams()">Refresh list</button>
    </div>

    <video id="video" controls autoplay muted playsinline></video>
    <p id="status" class="muted">Ready.</p>
    <pre id="detail" style="font-size:0.8rem;color:#666;max-height:120px;overflow:auto"></pre>
  </main>
  <script>
    let hlsInstance = null;
    let whepPc = null;
    let streamCatalog = [];

    function setStatus(text) {
      document.getElementById('status').textContent = text;
    }

    function selectedStream() {
      const id = document.getElementById('streamPick').value;
      return streamCatalog.find(s => String(s.id) === String(id));
    }

    async function refreshStreams() {
      const sel = document.getElementById('streamPick');
      try {
        const r = await fetch('/streams');
        streamCatalog = await r.json();
        sel.innerHTML = '';
        if (streamCatalog.length === 0) {
          sel.innerHTML = '<option value="">No live streams — start one on Stream page</option>';
          return;
        }
        const mode = streamCatalog[0].delivery || 'hls';
        document.getElementById('modeHint').textContent =
          mode === 'webrtc'
            ? 'WebRTC via MediaMTX (WHEP). Start MediaMTX before playing.'
            : 'HLS playback (~3s delay).';
        streamCatalog.forEach(s => {
          const opt = document.createElement('option');
          opt.value = s.id;
          opt.textContent = '#' + s.id + ' — ' + s.title + ' [' + (s.delivery || 'hls') + ']';
          sel.appendChild(opt);
        });
        const params = new URLSearchParams(location.search);
        if (params.get('stream')) sel.value = params.get('stream');
      } catch (e) {
        sel.innerHTML = '<option value="">Server not reachable</option>';
      }
    }

    function stopPlayers() {
      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }
      if (whepPc) {
        whepPc.close();
        whepPc = null;
      }
      document.getElementById('video').srcObject = null;
    }

    async function playWebrtc(whepUrl) {
      stopPlayers();
      const video = document.getElementById('video');
      setStatus('Connecting WebRTC (WHEP)…');

      const pc = new RTCPeerConnection({
        iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
      });
      whepPc = pc;

      pc.addTransceiver('video', { direction: 'recvonly' });
      pc.addTransceiver('audio', { direction: 'recvonly' });
      pc.ontrack = (ev) => {
        video.srcObject = ev.streams[0];
        setStatus('Playing (WebRTC / MediaMTX)');
        video.play().catch(() => {});
      };

      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);

      const resp = await fetch(whepUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/sdp' },
        body: offer.sdp
      });
      if (!resp.ok) {
        throw new Error('WHEP failed HTTP ' + resp.status + ' — is MediaMTX running?');
      }
      const answer = await resp.text();
      await pc.setRemoteDescription({ type: 'answer', sdp: answer });
    }

    function playHls(url, streamId) {
      stopPlayers();
      const video = document.getElementById('video');
      setStatus('Loading HLS ' + url + ' …');

      if (Hls.isSupported()) {
        hlsInstance = new Hls({
          liveSyncDuration: 3,
          liveMaxLatencyDuration: 10,
          maxBufferLength: 30,
          maxMaxBufferLength: 60,
          liveDurationInfinity: true
        });
        hlsInstance.loadSource(url);
        hlsInstance.attachMedia(video);
        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
          setStatus('Playing stream #' + streamId + ' (HLS)');
          video.play().catch(() => {});
        });
        hlsInstance.on(Hls.Events.ERROR, (_, data) => {
          document.getElementById('detail').textContent = JSON.stringify(data, null, 2);
          if (data.details === 'bufferStalledError') {
            setStatus('Buffer stalled — catching up…');
            hlsInstance.recoverMediaError();
            return;
          }
          if (!data.fatal) return;
          setStatus('HLS error: ' + data.details);
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        setStatus('Playing (Safari HLS)');
      }
    }

    async function loadStream() {
      const stream = selectedStream();
      if (!stream) {
        setStatus('Select a live stream first.');
        return;
      }
      document.getElementById('detail').textContent = '';
      try {
        if (stream.delivery === 'webrtc' && stream.webrtcWhepUrl) {
          await playWebrtc(stream.webrtcWhepUrl);
        } else if (stream.playbackUrl) {
          playHls(stream.playbackUrl, stream.id);
        } else {
          setStatus('No playback URL on stream response.');
        }
      } catch (e) {
        setStatus(String(e), false);
        document.getElementById('detail').textContent = String(e);
      }
    }

    refreshStreams();
    const params = new URLSearchParams(location.search);
    if (params.get('stream')) setTimeout(loadStream, 800);
  </script>
</body>
</html>
