<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Watch — LiveMart</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7"></script>
  <link rel="stylesheet" href="/ui/common.css">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="/ui/">LiveMart</a>
    <span class="live-dot">● LIVE</span>
  </header>

  <div class="page">
    <div class="card">
      <label for="streamPick">Live show</label>
      <select id="streamPick"><option>Loading…</option></select>
      <div class="actions">
        <button class="btn primary" id="playBtn" type="button">Watch</button>
        <button class="btn" id="refreshBtn" type="button">Refresh list</button>
      </div>
      <p id="playStatus" class="muted"></p>
      <p class="quality-badge" id="qualityBadge" style="display:none">Quality: —</p>

      <div class="video-stage">
        <video id="video" controls autoplay muted playsinline></video>
        <div class="pause-overlay" id="pauseOverlay">Stream paused</div>
      </div>

      <p class="stat" id="viewerStat">👀 — watching</p>

      <div class="coupon-banner" id="couponBanner">
        <strong id="couponTitle">Deal</strong>
        <p class="muted" style="margin:0.35rem 0 0">
          Use code <strong id="couponCodeLabel"></strong> —
          ends in <span id="couponTimer">0:00</span>
        </p>
        <button class="btn primary" type="button" id="copyBtn" style="margin-top:0.5rem">Copy code</button>
      </div>
    </div>
  </div>

  <script src="/ui/presence.js?v=3"></script>
  <script>
    let hlsInstance = null;
    let whepPc = null;
    let qualities = [];
    let qualityIndex = 0;
    let playbackTimer = null;
    let statsSample = null;
    let streamCatalog = [];
    let presenceId = null;
    let stopHeartbeat = null;
    let couponTimer = null;
    let activeStreamId = null;
    let activeCode = '';
    let reconnecting = false;
    let lastReconnectAt = 0;
    let zeroKbpsStreak = 0;
    let lastVideoBytes = 0;
    let lastVideoBytesGrowthAt = 0;
    let lastEncodeDegraded = null;
    let lowKbpsStreak = 0;
    let videoFlowing = false;
    let encodeSwitchInFlight = false;
    let hlsQosTimer = null;
    let joinTimestamp = 0;
    let ttffSent = false;
    let hlsStallStartedAt = 0;
    let lastHlsLevel = -1;
    let watchStartMs = 0;
    let watchingStreamId = null;
    let iceRecoveryTimer = null;

    const PLAYBACK_TICK_MS = 3000;
    const WEBRTC_QOS_STATS_MS = 3000;
    const HLS_QOS_STATS_MS = 8000;
    const ENCODE_SWITCH_RETRY_MS = 1000;
    const ENCODE_SWITCH_MAX_ATTEMPTS = 20;
    const ZERO_KBPS_STREAK_LIMIT = 5;
    const LOW_KBPS_STREAK_LIMIT = 4;
    const NO_BYTE_GROWTH_MS = 20000;
    const RECONNECT_COOLDOWN_MS = 8000;
    const ICE_GATHER_MS = 2500;

    const video = document.getElementById('video');
    const viewerStat = document.getElementById('viewerStat');
    const playStatus = document.getElementById('playStatus');
    const couponBanner = document.getElementById('couponBanner');
    const pauseOverlay = document.getElementById('pauseOverlay');

    function selectedStream() {
      const id = document.getElementById('streamPick').value;
      return streamCatalog.find(s => String(s.id) === String(id));
    }

    async function refreshStreams() {
      const sel = document.getElementById('streamPick');
      try {
        streamCatalog = await fetch('/streams').then(r => r.json());
        sel.innerHTML = '';
        if (streamCatalog.length === 0) {
          sel.innerHTML = '<option value="">No live show — start one on Streamer page</option>';
          return;
        }
        streamCatalog.forEach(s => {
          const o = document.createElement('option');
          o.value = s.id;
          o.textContent = '#' + s.id + ' — ' + s.title + (s.status === 'PAUSED' ? ' (paused)' : '');
          sel.appendChild(o);
        });
        const q = new URLSearchParams(location.search).get('stream');
        if (q) sel.value = q;
      } catch (e) {
        sel.innerHTML = '<option value="">Server offline?</option>';
      }
    }

    function stopPresence() {
      if (stopHeartbeat) {
        stopHeartbeat();
        stopHeartbeat = null;
      }
      if (activeStreamId && presenceId) {
        Presence.leave(activeStreamId, presenceId);
      }
      presenceId = null;
      activeStreamId = null;
      watchingStreamId = null;
      if (couponTimer) clearInterval(couponTimer);
      couponBanner.classList.remove('show');
    }

    function setPaused(paused) {
      if (paused) {
        pauseOverlay.classList.add('show');
        video.muted = true;
      } else {
        pauseOverlay.classList.remove('show');
        video.muted = false;
      }
    }

    function applyRoom(room) {
      viewerStat.textContent = '👀 ' + room.viewers + ' watching';
      if (room.streamStatus === 'ENDED' && whepPc) {
        stopPlayers();
        playStatus.textContent = 'Stream ended.';
        return;
      }
      setPaused(room.streamStatus === 'PAUSED');
      if (room.coupon && room.coupon.expiresAt > Date.now()) {
        showCoupon(room.coupon);
      }
      if (whepPc && typeof room.encodeDegraded === 'boolean') {
        const desired = room.encodeDegraded;
        if (lastEncodeDegraded !== desired && !encodeSwitchInFlight) {
          const target = desired
            ? Math.min(qualityIndex + 1, qualities.length - 1)
            : 0;
          reconnectForEncodeChange(target, desired);
        }
      }
    }

    function showCoupon(c) {
      activeCode = c.code;
      document.getElementById('couponTitle').textContent = c.percentOff + '% off';
      document.getElementById('couponCodeLabel').textContent = c.code;
      couponBanner.classList.add('show');
      if (couponTimer) clearInterval(couponTimer);
      const timerEl = document.getElementById('couponTimer');
      couponTimer = setInterval(() => {
        const left = Math.max(0, c.expiresAt - Date.now());
        const sec = Math.ceil(left / 1000);
        timerEl.textContent = Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
        if (left <= 0) {
          couponBanner.classList.remove('show');
          clearInterval(couponTimer);
        }
      }, 300);
    }

    async function startPresence(streamId) {
      if (activeStreamId === streamId && presenceId) {
        return;
      }
      stopPresence();
      activeStreamId = streamId;
      try {
        const data = await Presence.join(streamId);
        presenceId = data.presenceId;
        applyRoom(data.room);
        stopHeartbeat = Presence.startHeartbeat(streamId, presenceId, applyRoom);
      } catch (e) {
        viewerStat.textContent = '👀 count unavailable';
        console.warn(e);
      }
    }

    function stopPlayers() {
      if (iceRecoveryTimer) { clearTimeout(iceRecoveryTimer); iceRecoveryTimer = null; }
      if (hlsQosTimer) { clearInterval(hlsQosTimer); hlsQosTimer = null; }
      if (playbackTimer) { clearInterval(playbackTimer); playbackTimer = null; }
      statsSample = null;
      ttffSent = false;
      lastHlsLevel = -1;
      hlsStallStartedAt = 0;
      zeroKbpsStreak = 0;
      videoFlowing = false;
      lastEncodeDegraded = null;
      encodeSwitchInFlight = false;
      reconnecting = false;
      if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
      if (whepPc) { whepPc.close(); whepPc = null; }
      video.srcObject = null;
      document.getElementById('qualityBadge').style.display = 'none';
      setPaused(false);
    }

    function isPlaybackPaused() {
      return pauseOverlay.classList.contains('show');
    }

    function canReconnect() {
      return whepPc && qualities.length > 0 && !reconnecting && !isPlaybackPaused();
    }

    function isWhepNotReadyError(err) {
      const status = err && err.httpStatus;
      return status === 404 || status === 502 || status === 503;
    }

    function sleep(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    /** Broadcaster degrade/restore restarts FFmpeg — wait for RTMP paths before WHEP. */
    async function reconnectForEncodeChange(targetIndex, degraded) {
      if (!canReconnect() || encodeSwitchInFlight) return;
      const q = qualities[targetIndex];
      if (!q) return;

      encodeSwitchInFlight = true;
      reconnecting = true;
      const label = degraded ? 'Streamer degraded' : 'Streamer restored quality';
      playStatus.textContent = label + ' — reconnecting…';

      try {
        for (let attempt = 0; attempt < ENCODE_SWITCH_MAX_ATTEMPTS; attempt++) {
          if (attempt > 0) {
            playStatus.textContent = label + ' — waiting for live feed (' + attempt + ')…';
            await sleep(ENCODE_SWITCH_RETRY_MS);
          }
          if (!canReconnect()) return;
          try {
            const prevIdx = qualityIndex;
            const outageStart = Date.now();
            postViewerEvent('RECONNECT', q.label, label);
            await connectWhep(q.webrtcWhepUrl);
            qualityIndex = targetIndex;
            zeroKbpsStreak = 0;
            lowKbpsStreak = 0;
            videoFlowing = false;
            lastVideoBytesGrowthAt = Date.now();
            lastReconnectAt = Date.now();
            updateQualityBadge(q.label, 0);
            playStatus.textContent = 'Playing (' + q.label + ')';
            lastEncodeDegraded = degraded;
            if (targetIndex > prevIdx) postViewerEvent('ABR_DOWN', q.label, 'Encode degrade');
            else if (targetIndex < prevIdx) postViewerEvent('ABR_UP', q.label, 'Encode restore');
            postViewerEvent('RECOVERED', Date.now() - outageStart, label);
            return;
          } catch (e) {
            if (!isWhepNotReadyError(e) || attempt === ENCODE_SWITCH_MAX_ATTEMPTS - 1) {
              console.warn('encode switch reconnect failed', e);
              playStatus.textContent = label + ' — still waiting; will retry on next heartbeat';
              return;
            }
          }
        }
      } finally {
        reconnecting = false;
        encodeSwitchInFlight = false;
      }
    }

    async function reconnectToQuality(index, reason) {
      if ((!whepPc && !qualities.length) || reconnecting || encodeSwitchInFlight || isPlaybackPaused()) return;
      const now = Date.now();
      if (now - lastReconnectAt < RECONNECT_COOLDOWN_MS) return;
      const target = Math.max(0, Math.min(index, qualities.length - 1));
      const q = qualities[target];
      if (!q) return;

      const prevIndex = qualityIndex;
      const outageStart = Date.now();
      reconnecting = true;
      lastReconnectAt = now;
      playStatus.textContent = reason + ' — reconnecting…';
      postViewerEvent('RECONNECT', q.label, reason);
      try {
        await connectWhep(q.webrtcWhepUrl);
        qualityIndex = target;
        zeroKbpsStreak = 0;
        lowKbpsStreak = 0;
        videoFlowing = false;
        lastVideoBytesGrowthAt = Date.now();
        updateQualityBadge(q.label, 0);
        playStatus.textContent = 'Playing (' + q.label + ')';
        if (target > prevIndex) {
          postViewerEvent('ABR_DOWN', q.label, 'Stepped down to ' + q.label);
        } else if (target < prevIndex) {
          postViewerEvent('ABR_UP', q.label, 'Stepped up to ' + q.label);
        }
        postViewerEvent('RECOVERED', Date.now() - outageStart, 'Playback recovered');
      } catch (e) {
        playStatus.textContent = 'Reconnect failed — retrying…';
        console.warn('reconnect failed', e);
        if (isWhepNotReadyError(e)) {
          scheduleIceRecovery(reason);
        } else if (target < qualities.length - 1) {
          reconnecting = false;
          await reconnectToQuality(target + 1, 'Trying lower quality');
          return;
        } else {
          playStatus.textContent = String(e);
          postViewerEvent('FATAL', null, String(e));
        }
      } finally {
        reconnecting = false;
      }
    }

    function scheduleIceRecovery(reason) {
      if (iceRecoveryTimer || !presenceId || isPlaybackPaused()) return;
      iceRecoveryTimer = setTimeout(() => {
        iceRecoveryTimer = null;
        if (!whepPc || reconnecting || encodeSwitchInFlight) return;
        reconnectToQuality(qualityIndex, reason || 'Auto-recover').catch((e) => console.warn(e));
      }, 2000);
    }

    async function handlePlaybackStall(reason) {
      if (!canReconnect() || videoFlowing) return;
      postViewerEvent('STALL', null, reason);
      if (qualityIndex >= qualities.length - 1) {
        playStatus.textContent = 'No video yet — keep broadcaster live; same Wi‑Fi as ' + location.host;
        scheduleIceRecovery(reason);
        return;
      }
      await reconnectToQuality(qualityIndex + 1, reason);
    }

    function updateQualityBadge(label, downloadKbps) {
      const el = document.getElementById('qualityBadge');
      el.style.display = 'inline-block';
      const dl = downloadKbps > 0 ? ' · ↓ ~' + downloadKbps + ' kbps' : '';
      el.textContent = 'Quality: ' + label + dl;
    }

    /** Use same-origin /whep path from API (app proxies to MediaMTX on :8889). */
    function resolveWhepUrl(url) {
      if (!url) return url;
      try {
        const u = new URL(url, location.origin);
        if (u.pathname.startsWith('/whep/')) return u.pathname;
      } catch (e) {
        if (String(url).startsWith('/whep/')) return url;
      }
      return url;
    }

    async function connectWhep(url) {
      url = resolveWhepUrl(url);
      if (whepPc) {
        whepPc.onconnectionstatechange = null;
        whepPc.oniceconnectionstatechange = null;
        whepPc.close();
        whepPc = null;
        video.srcObject = null;
      }
      statsSample = null;
      zeroKbpsStreak = 0;
      lowKbpsStreak = 0;
      videoFlowing = false;
      const pc = new RTCPeerConnection({ iceServers: [] });
      whepPc = pc;
      pc.addTransceiver('video', { direction: 'recvonly' });
      pc.oniceconnectionstatechange = () => {
        if (pc !== whepPc) return;
        const st = pc.iceConnectionState;
        if ((st === 'failed' || st === 'disconnected') && !reconnecting && !encodeSwitchInFlight) {
          scheduleIceRecovery('ICE ' + st);
        }
      };
      pc.onconnectionstatechange = () => {
        if (pc !== whepPc) return;
        if (pc.connectionState === 'failed' && !reconnecting && !encodeSwitchInFlight) {
          scheduleIceRecovery('Connection failed');
        }
      };
      pc.ontrack = (ev) => {
        if (pc !== whepPc) return;
        video.srcObject = ev.streams[0];
        video.muted = true;
        video.play().catch(() => {});
        videoFlowing = true;
        lastVideoBytesGrowthAt = Date.now();
        playStatus.textContent = 'Playing';
      };
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      await waitForIceGathering(pc);
      const resp = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/sdp' },
        body: pc.localDescription.sdp,
      });
      if (!resp.ok) {
        const err = new Error(
          resp.status === 404
            ? 'Stream not ready on MediaMTX (broadcaster may be restarting FFmpeg)'
            : 'Video failed — run ./scripts/start-mediamtx.sh'
        );
        err.httpStatus = resp.status;
        throw err;
      }
      await pc.setRemoteDescription({ type: 'answer', sdp: await resp.text() });
      lastVideoBytesGrowthAt = Date.now();
    }

    function waitForIceGathering(pc) {
      if (pc.iceGatheringState === 'complete') return Promise.resolve();
      return new Promise((resolve) => {
        const done = () => {
          if (pc.iceGatheringState === 'complete') {
            pc.removeEventListener('icegatheringstatechange', done);
            clearTimeout(timer);
            resolve();
          }
        };
        pc.addEventListener('icegatheringstatechange', done);
        const timer = setTimeout(() => {
          pc.removeEventListener('icegatheringstatechange', done);
          resolve();
        }, ICE_GATHER_MS);
      });
    }

    async function readWebRtcQos(pc) {
      const reports = await pc.getStats();
      let bytes = 0;
      let packetsLost = 0;
      let packetsReceived = 0;
      let jitterMs = 0;
      let rttMs = 0;
      reports.forEach((r) => {
        if (r.type === 'inbound-rtp' && r.kind === 'video') {
          bytes += r.bytesReceived || 0;
          packetsLost += r.packetsLost || 0;
          packetsReceived += r.packetsReceived || 0;
          if (r.jitter != null) jitterMs = Math.max(jitterMs, r.jitter * 1000);
        }
        if (r.type === 'remote-inbound-rtp' && r.kind === 'video' && r.roundTripTime != null) {
          rttMs = Math.round(r.roundTripTime * 1000);
        }
        if (r.type === 'candidate-pair' && r.nominated && r.currentRoundTripTime != null) {
          rttMs = Math.round(r.currentRoundTripTime * 1000);
        }
      });
      const now = Date.now();
      let kbps = 0;
      if (!statsSample) {
        statsSample = { bytes, at: now };
      } else {
        const deltaBytes = Math.max(0, bytes - statsSample.bytes);
        const deltaMs = Math.max(1, now - statsSample.at);
        kbps = Math.round((deltaBytes * 8) / deltaMs);
        statsSample = { bytes, at: now };
      }
      const totalPkts = packetsLost + packetsReceived;
      const lossPct = totalPkts > 0 ? (packetsLost / totalPkts) * 100 : 0;
      return { bytes, kbps, lossPct, rttMs, jitterMs };
    }

    function beaconWebrtcTtff() {
      if (ttffSent || !joinTimestamp) return;
      ttffSent = true;
      postViewerEvent('TTFF', Date.now() - joinTimestamp, 'WebRTC time to first frame');
    }

    async function runPlaybackTick() {
      if (!whepPc || reconnecting || isPlaybackPaused()) return;

      const { bytes, kbps, lossPct, rttMs, jitterMs } = await readWebRtcQos(whepPc);
      const current = qualities[qualityIndex];
      if (!current) return;

      updateQualityBadge(current.label, kbps);
      postViewerStats(current.label, kbps, lossPct, rttMs, jitterMs);

      if (bytes > lastVideoBytes) {
        lastVideoBytes = bytes;
        lastVideoBytesGrowthAt = Date.now();
        if (bytes > 0) videoFlowing = true;
      }

      if (videoFlowing) beaconWebrtcTtff();

      if (!videoFlowing) {
        const noBytesYet = Date.now() - lastVideoBytesGrowthAt > NO_BYTE_GROWTH_MS;
        if (noBytesYet) await handlePlaybackStall('No video data');
        return;
      }

      const noGrowth = Date.now() - lastVideoBytesGrowthAt > NO_BYTE_GROWTH_MS;
      if (kbps <= 0) {
        zeroKbpsStreak += 1;
        if (noGrowth && zeroKbpsStreak >= ZERO_KBPS_STREAK_LIMIT) {
          videoFlowing = false;
          await handlePlaybackStall('Video stalled');
        }
        return;
      }

      zeroKbpsStreak = 0;
      if (qualities.length <= 1) return;

      if (kbps < current.minDownloadKbps * 0.85 && qualityIndex < qualities.length - 1) {
        lowKbpsStreak += 1;
        if (lowKbpsStreak >= LOW_KBPS_STREAK_LIMIT) {
          lowKbpsStreak = 0;
          videoFlowing = false;
          await reconnectToQuality(qualityIndex + 1, 'Low download — stepping down');
        }
        return;
      }

      lowKbpsStreak = 0;

      if (qualityIndex > 0) {
        const upper = qualities[qualityIndex - 1];
        if (kbps > upper.minDownloadKbps * 1.25) {
          await reconnectToQuality(qualityIndex - 1, 'Stepping up');
        }
      }
    }

    function startPlaybackMonitor() {
      if (playbackTimer) clearInterval(playbackTimer);
      lastVideoBytes = 0;
      lastVideoBytesGrowthAt = Date.now();
      zeroKbpsStreak = 0;
      lowKbpsStreak = 0;
      videoFlowing = false;
      playbackTimer = setInterval(() => {
        runPlaybackTick().catch((e) => console.warn('playback tick', e));
      }, PLAYBACK_TICK_MS);
    }

    async function playWebrtc(stream) {
      stopPlayers();
      qualities = (stream.qualities && stream.qualities.length > 0)
        ? stream.qualities
        : [{ id: 'high', label: '720p', webrtcWhepUrl: stream.webrtcWhepUrl, minDownloadKbps: 800 }];
      qualityIndex = 0;
      lastEncodeDegraded = !!stream.encodeDegraded;
      await connectWhep(qualities[0].webrtcWhepUrl);
      updateQualityBadge(qualities[0].label, 0);
      startPlaybackMonitor();
    }

    function hlsLevelLabel(hls, levelIndex) {
      if (levelIndex < 0 || !hls.levels || !hls.levels[levelIndex]) return 'auto';
      const lvl = hls.levels[levelIndex];
      return lvl.height ? lvl.height + 'p' : (lvl.bitrate ? Math.round(lvl.bitrate / 1000) + 'k' : '—');
    }

    async function postViewerEvent(eventType, detail, message) {
      if (!activeStreamId || !presenceId) return;
      try {
        await fetch('/streams/' + activeStreamId + '/qos/viewer-event', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            presenceId,
            eventType,
            message: message || eventType,
            detail: detail != null ? String(detail) : undefined,
          }),
        });
      } catch (e) {
        console.warn('viewer-event', e);
      }
    }

    async function postViewerStats(qualityLabel, downloadKbps, packetLossPct, rttMs, jitterMs) {
      if (!activeStreamId || !presenceId) return;
      try {
        await fetch('/streams/' + activeStreamId + '/qos/viewer-stats', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            presenceId,
            qualityLabel: qualityLabel || '720p',
            packetLossPct: packetLossPct != null ? packetLossPct : 0,
            rttMs: rttMs != null ? rttMs : 0,
            jitterMs: jitterMs != null ? jitterMs : 0,
            downloadKbps: downloadKbps || 0,
          }),
        });
      } catch (e) {
        console.warn('viewer-stats', e);
      }
    }

    function beaconHlsTtff() {
      if (ttffSent || !joinTimestamp) return;
      const ttff = Date.now() - joinTimestamp;
      ttffSent = true;
      postViewerEvent('TTFF', ttff, 'HLS time to first frame');
    }

    function setupHlsQos(hls) {
      hls.on(Hls.Events.FRAG_BUFFERED, (_e, data) => {
        if (data.frag && data.frag.type === 'main' && !ttffSent) {
          beaconHlsTtff();
        }
        if (hlsStallStartedAt > 0) {
          const dur = Date.now() - hlsStallStartedAt;
          hlsStallStartedAt = 0;
          postViewerEvent('RECOVERED', dur, 'HLS recovered from stall');
        }
      });

      hls.on(Hls.Events.ERROR, (_e, data) => {
        if (!data) return;
        const stalled = data.details === 'manifestStalled' || data.details === 'bufferStalledError';
        if (stalled && hlsStallStartedAt === 0) {
          hlsStallStartedAt = Date.now();
          postViewerEvent('STALL', null, 'HLS buffer stall');
        }
      });

      hls.on(Hls.Events.LEVEL_SWITCHED, (_e, data) => {
        const newLevel = data.level;
        if (lastHlsLevel >= 0 && newLevel !== lastHlsLevel) {
          const label = hlsLevelLabel(hls, newLevel);
          const type = newLevel < lastHlsLevel ? 'ABR_DOWN' : 'ABR_UP';
          postViewerEvent(type, label, 'HLS quality ' + type);
        }
        lastHlsLevel = newLevel;
        updateQualityBadge(hlsLevelLabel(hls, newLevel), 0);
      });

      video.addEventListener('waiting', () => {
        if (hlsStallStartedAt === 0) {
          hlsStallStartedAt = Date.now();
          postViewerEvent('STALL', null, 'Video waiting');
        }
      });
      video.addEventListener('playing', () => {
        if (hlsStallStartedAt > 0) {
          const dur = Date.now() - hlsStallStartedAt;
          hlsStallStartedAt = 0;
          postViewerEvent('RECOVERED', dur, 'Video resumed');
        }
      });

      if (hlsQosTimer) clearInterval(hlsQosTimer);
      hlsQosTimer = setInterval(() => {
        if (!hlsInstance) return;
        const kbps = hls.bandwidthEstimate ? Math.round(hls.bandwidthEstimate / 1000) : 0;
        const label = hlsLevelLabel(hls, hls.currentLevel);
        updateQualityBadge(label, kbps);
        postViewerStats(label, kbps, 0, 0, 0);
      }, HLS_QOS_STATS_MS);
    }

    function playHls(url) {
      stopPlayers();
      if (Hls.isSupported()) {
        hlsInstance = new Hls({ liveSyncDuration: 3 });
        hlsInstance.loadSource(url);
        hlsInstance.attachMedia(video);
        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
        setupHlsQos(hlsInstance);
      } else {
        video.src = url;
        video.addEventListener('loadeddata', beaconHlsTtff, { once: true });
      }
    }

    async function watch() {
      const stream = selectedStream();
      if (!stream) {
        playStatus.textContent = 'Pick a live show.';
        return;
      }
      if (watchingStreamId === stream.id && (whepPc || hlsInstance)) {
        return;
      }
      playStatus.textContent = 'Connecting…';
      try {
        const newSession = activeStreamId !== stream.id || !presenceId;
        await startPresence(stream.id);
        if (newSession) {
          joinTimestamp = Date.now();
          watchStartMs = joinTimestamp;
          ttffSent = false;
        }
        watchingStreamId = stream.id;
        if (stream.delivery === 'webrtc' && (stream.webrtcWhepUrl || (stream.qualities && stream.qualities.length))) {
          await playWebrtc(stream);
        } else if (stream.playbackUrl) {
          playHls(stream.playbackUrl);
        } else {
          playStatus.textContent = 'No playback URL.';
          return;
        }
        playStatus.textContent = 'Playing';
        setPaused(stream.status === 'PAUSED');
        history.replaceState(null, '', '?stream=' + stream.id);
      } catch (e) {
        playStatus.textContent = String(e);
        postViewerEvent('FATAL', null, String(e));
      }
    }

    document.getElementById('copyBtn').onclick = () => {
      if (activeCode) navigator.clipboard.writeText(activeCode).catch(() => {});
    };
    document.getElementById('playBtn').onclick = watch;
    document.getElementById('refreshBtn').onclick = refreshStreams;
    window.addEventListener('beforeunload', () => {
      if (activeStreamId && presenceId && watchStartMs > 0) {
        const watchSec = Math.round((Date.now() - watchStartMs) / 1000);
        navigator.sendBeacon(
          '/streams/' + activeStreamId + '/qos/viewer-event',
          new Blob([JSON.stringify({
            presenceId,
            eventType: 'WATCH_SEC',
            detail: String(watchSec),
            message: 'Watch duration',
          })], { type: 'application/json' })
        );
      }
      stopPresence();
    });

    refreshStreams().then(() => {
      if (new URLSearchParams(location.search).get('stream')) setTimeout(watch, 400);
    });
  </script>
</body>
</html>
