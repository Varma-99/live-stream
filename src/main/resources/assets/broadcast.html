<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Go live — LiveMart</title>
  <link rel="stylesheet" href="/ui/common.css">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="/ui/">LiveMart</a>
    <span class="live-dot" id="liveDot" style="display:none">● LIVE</span>
  </header>

  <div class="page">
    <div class="card">
      <h1>Streamer</h1>
      <p class="muted">Video is captured by FFmpeg on this computer (not this browser). Closing this tab ends the stream after ~15 seconds unless you click <strong>End show</strong>.</p>

      <label for="title">Show title</label>
      <input id="title" type="text" value="My live sale">

      <div class="actions">
        <button class="btn primary" id="startBtn" type="button">Start show</button>
        <button class="btn" id="pauseBtn" type="button" disabled>Pause</button>
        <button class="btn" id="resumeBtn" type="button" disabled style="display:none">Resume</button>
        <button class="btn danger" id="stopBtn" type="button" disabled>End show</button>
      </div>
      <div id="message"></div>

      <p class="stat" id="viewerStat" style="display:none">👀 0 watching</p>
      <p class="ingest-warn" id="ingestWarn" style="display:none" role="alert"></p>
      <div class="actions" id="demoPanel" style="display:none">
        <button class="btn" type="button" id="ingestDemoBtn" title="Dev only: fake low upload for banner demo">Simulate network drop (demo)</button>
      </div>
      <p class="links" id="watchLinks" style="display:none">
        Viewers open: <a id="watchLink" href="#" target="_blank">watch link</a>
      </p>
    </div>

    <div class="card coupon-box" id="couponPanel" style="display:none">
      <h2>Drop coupon for viewers</h2>
      <div class="row">
        <div>
          <label for="percentOff">Discount %</label>
          <select id="percentOff">
            <option value="10">10%</option>
            <option value="15">15%</option>
            <option value="20" selected>20%</option>
            <option value="25">25%</option>
            <option value="30">30%</option>
          </select>
        </div>
        <div>
          <label for="durationSec">Show for</label>
          <select id="durationSec">
            <option value="30">30 seconds</option>
            <option value="60" selected>1 minute</option>
            <option value="120">2 minutes</option>
            <option value="300">5 minutes</option>
          </select>
        </div>
        <div>
          <label for="couponCode">Coupon code</label>
          <input id="couponCode" type="text" value="LIVE20" maxlength="32">
        </div>
      </div>
      <div class="actions">
        <button class="btn primary" type="button" id="dropCouponBtn">Send coupon to all viewers</button>
      </div>
    </div>
  </div>

  <script src="/ui/presence.js?v=2"></script>
  <script>
    let currentStreamId = null;
    let streamStatus = null;
    let stopPoll = null;
    let stopBroadcasterHeartbeat = null;
    let endingIntentionally = false;

    const msgEl = document.getElementById('message');

    /** Works even if the browser cached an old presence.js without broadcaster heartbeat. */
    function startBroadcasterHeartbeatSafe(streamId) {
      if (window.Presence && typeof Presence.startBroadcasterHeartbeat === 'function') {
        return Presence.startBroadcasterHeartbeat(streamId);
      }
      const tick = () => {
        fetch('/streams/' + streamId + '/broadcaster-heartbeat', { method: 'POST' }).catch(() => {});
      };
      tick();
      const id = setInterval(tick, 5000);
      return () => clearInterval(id);
    }

    function showMessage(text, ok) {
      msgEl.textContent = text;
      msgEl.id = 'message';
      msgEl.className = ok ? 'ok' : 'err';
    }

    function applyIngestWarning(room) {
      const warn = document.getElementById('ingestWarn');
      if (room.ingestUnstable) {
        const msg = room.ingestWarning || 'Network unstable — check your upload';
        warn.textContent = '⚠ ' + msg + (room.ingestBitrateKbps > 0 ? ' (~' + room.ingestBitrateKbps + ' kbps)' : '');
        warn.style.display = 'block';
      } else {
        warn.style.display = 'none';
      }
    }

    function handleRoomUpdate(room) {
      if (room.streamStatus === 'ENDED') {
        setLive(false);
        showMessage('Stream ended — control panel was closed or connection lost.', false);
        return;
      }
      document.getElementById('viewerStat').textContent = '👀 ' + room.viewers + ' watching';
      if (room.streamStatus) updatePauseButtons(room.streamStatus);
      applyIngestWarning(room);
    }

    function updatePauseButtons(status) {
      streamStatus = status;
      const paused = status === 'PAUSED';
      document.getElementById('pauseBtn').disabled = !currentStreamId || paused;
      document.getElementById('pauseBtn').style.display = paused ? 'none' : 'inline-block';
      document.getElementById('resumeBtn').disabled = !currentStreamId || !paused;
      document.getElementById('resumeBtn').style.display = paused ? 'inline-block' : 'none';
      const dot = document.getElementById('liveDot');
      dot.textContent = paused ? '● PAUSED' : '● LIVE';
      dot.style.color = paused ? '#f57c00' : '#c62828';
    }

    function setLive(on, streamId, status) {
      document.getElementById('startBtn').disabled = on;
      document.getElementById('stopBtn').disabled = !on;
      document.getElementById('liveDot').style.display = on ? 'inline' : 'none';
      document.getElementById('viewerStat').style.display = on ? 'inline-block' : 'none';
      document.getElementById('watchLinks').style.display = on ? 'block' : 'none';
      document.getElementById('couponPanel').style.display = on ? 'block' : 'none';
      document.getElementById('demoPanel').style.display = on ? 'flex' : 'none';

      if (stopPoll) {
        stopPoll();
        stopPoll = null;
      }
      if (stopBroadcasterHeartbeat) {
        stopBroadcasterHeartbeat();
        stopBroadcasterHeartbeat = null;
      }

      if (on && streamId) {
        currentStreamId = streamId;
        updatePauseButtons(status || 'LIVE');
        const link = location.origin + '/ui/viewer.html?stream=' + streamId;
        const a = document.getElementById('watchLink');
        a.href = link;
        a.textContent = link;
        stopBroadcasterHeartbeat = startBroadcasterHeartbeatSafe(streamId);
        stopPoll = Presence.startBroadcasterPoll(streamId, handleRoomUpdate);
      } else {
        currentStreamId = null;
        streamStatus = null;
        endingIntentionally = false;
        document.getElementById('viewerStat').textContent = '👀 0 watching';
        document.getElementById('ingestWarn').style.display = 'none';
        updatePauseButtons('LIVE');
      }
    }

    async function refreshLive() {
      try {
        const list = await fetch('/streams').then(r => r.json());
        const mine = list.find(s => s.broadcasterId === 1);
        if (mine) setLive(true, mine.id, mine.status);
        else setLive(false);
      } catch (e) {
        showMessage('Server not running?', false);
      }
    }

    window.addEventListener('beforeunload', (e) => {
      if (currentStreamId && !endingIntentionally) {
        e.preventDefault();
        e.returnValue = 'Your stream is still live. FFmpeg keeps running until you end the show or this tab stops heartbeating (~15s).';
      }
    });

    document.getElementById('startBtn').onclick = async () => {
      const title = document.getElementById('title').value.trim();
      if (!title) {
        showMessage('Enter a title', false);
        return;
      }
      try {
        const r = await fetch('/streams/start', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ broadcasterId: 1, title }),
        });
        const data = await r.json();
        if (!r.ok) {
          showMessage(data.error || 'Could not start', false);
          return;
        }
        setLive(true, data.id, data.status);
        showMessage('Live! Open the watch link in other tabs — each tab counts as a viewer.', true);
      } catch (e) {
        showMessage(String(e), false);
      }
    };

    document.getElementById('pauseBtn').onclick = async () => {
      if (!currentStreamId) return;
      try {
        const r = await fetch('/streams/' + currentStreamId + '/pause', { method: 'POST' });
        const data = await r.json();
        if (!r.ok) {
          showMessage(data.error || 'Pause failed', false);
          return;
        }
        updatePauseButtons('PAUSED');
        showMessage('Paused — viewers see a black screen. FFmpeg still running.', true);
      } catch (e) {
        showMessage(String(e), false);
      }
    };

    document.getElementById('resumeBtn').onclick = async () => {
      if (!currentStreamId) return;
      try {
        const r = await fetch('/streams/' + currentStreamId + '/resume', { method: 'POST' });
        const data = await r.json();
        if (!r.ok) {
          showMessage(data.error || 'Resume failed', false);
          return;
        }
        updatePauseButtons('LIVE');
        showMessage('Resumed — live video again for viewers.', true);
      } catch (e) {
        showMessage(String(e), false);
      }
    };

    document.getElementById('stopBtn').onclick = async () => {
      if (!currentStreamId) return;
      endingIntentionally = true;
      try {
        const r = await fetch('/streams/' + currentStreamId + '/stop', { method: 'POST' });
        if (!r.ok) {
          const data = await r.json();
          showMessage(data.error || 'Stop failed', false);
          endingIntentionally = false;
          return;
        }
        setLive(false);
        showMessage('Show ended.', true);
      } catch (e) {
        showMessage(String(e), false);
        endingIntentionally = false;
      }
    };

    document.getElementById('ingestDemoBtn').onclick = async () => {
      if (!currentStreamId) return;
      try {
        const r = await fetch('/streams/' + currentStreamId + '/ingest-demo', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ durationSec: 60 }),
        });
        if (r.status === 204) {
          showMessage('Demo: unstable upload simulated for 60s — watch for the orange banner.', true);
          const room = await fetch('/streams/' + currentStreamId + '/room').then(res => res.json());
          applyIngestWarning(room);
        } else {
          const data = await r.json();
          showMessage(data.error || 'Demo failed', false);
        }
      } catch (e) {
        showMessage(String(e), false);
      }
    };

    document.getElementById('dropCouponBtn').onclick = async () => {
      if (!currentStreamId) {
        showMessage('Start a show first', false);
        return;
      }
      const code = document.getElementById('couponCode').value.trim();
      const percentOff = parseInt(document.getElementById('percentOff').value, 10);
      const durationSec = parseInt(document.getElementById('durationSec').value, 10);
      if (!/^[A-Za-z0-9_-]+$/.test(code)) {
        showMessage('Code: letters, numbers, _ and - only', false);
        return;
      }
      try {
        const r = await fetch('/streams/' + currentStreamId + '/coupon', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code, percentOff, durationSec }),
        });
        if (r.status === 204) {
          showMessage('Coupon sent — viewers will see it within 2 seconds.', true);
        } else {
          const data = await r.json();
          showMessage(data.error || 'Coupon failed', false);
        }
      } catch (e) {
        showMessage(String(e), false);
      }
    };

    refreshLive();
  </script>
</body>
</html>
