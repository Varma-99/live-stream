# SRS origin — RTMP ingest + HTTP API. Forwards streams to playback tier.
# Playback tier is standalone SRS (SRS 6 disables WebRTC on cluster remote/edge nodes).

listen 1935;
max_connections 1000;
daemon off;
srs_log_tank console;

http_api {
    enabled on;
    listen 1985;
}

http_server {
    enabled on;
    listen 8080;
    dir ./objs/nginx/html;
}

stats {
    network 0;
}

vhost __defaultVhost__ {
    forward {
        enabled on;
        destination srs-playback-1:1935/live/[stream];
    }
    http_remux {
        enabled on;
        mount [vhost]/[app]/[stream].flv;
    }
    hls {
        enabled on;
        hls_fragment 2;
        hls_window 10;
    }
}
